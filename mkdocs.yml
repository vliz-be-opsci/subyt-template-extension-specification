site_name: SU-by-T Template Extension Specification
site_description: Formal specification and compliance documentation
site_author: VLIZ Opsci
repo_url: https://github.com/vliz-be-opsci/subyt-template-extension-specification

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Specification: specification.md
  - Authoring Guide: authoring.md
  - Compliance: compliance.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - tables
  - fenced_code
  - attr_list
